i<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión</title>

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { background: #181920; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }

        .login-card { background: #232430; padding: 2.5rem; border-radius: 10px; width: 100%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

        .login-card h2 { margin-bottom: 1.5rem; text-align: center; color: #00f2c3; }

        .alert { background: rgba(255, 77, 77, 0.2); color: #ff4d4d; border: 1px solid #ff4d4d; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; }

        .form-group { margin-bottom: 1.2rem; }

        .form-group label { display: block; margin-bottom: 0.4rem; color: #a9a9b9; font-size: 0.9rem; }

        .form-group input { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #3e3f5b; background: #181920; color: #fff; outline: none; }

        .btn-submit { width: 100%; padding: 0.8rem; border: none; border-radius: 6px; background: #00f2c3; color: #181920; font-weight: bold; cursor: pointer; transition: 0.2s; }

        .btn-submit:hover { background: #00d8ae}; 
    </style>

</head>

<body>



    <div class="login-card">

        <h2>Iniciar Sesión</h2>


{% if error %}
    <div class="alert">{{ error }}</div>
{% endif %}




        <form method="POST" action="{% url 'login' %}">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">Usuario</label>

                <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario">

            </div>



            <div class="form-group">

                <label for="password">Contraseña</label>

                <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">

            </div>



            <button type="submit" class="btn-submit">Ingresar</button>

        </form>

    </div>



</body>

</html>
